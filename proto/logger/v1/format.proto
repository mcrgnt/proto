syntax = "proto3";

package logger.v1;

import "buf/validate/validate.proto";
import "options/v1/options.proto";

message Format {
  string value = 1 [
    (buf.validate.field).string = {
      in: ["json", "text"]
    },
    (options.v1.usage) = "Формат сообщений логов (нижний регистр): json, text"
  ];
}
