syntax = "proto3";

package logger.v1;

import "buf/validate/validate.proto";
import "options/v1/options.proto";

message Level {
  string value = 1 [
    (buf.validate.field).string = {
      in: ["debug", "info", "warn", "error"]
    },
    (options.v1.usage) = "Уровень детализации логов (нижний регистр): debug, info, warn, error"
  ];
}
